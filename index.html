<!doctype html>
<html class="h-full w-full" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ctrl-X Angle Visualizer (based on Pedro Pathing Visualizer)</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
  </head>
  <body
    class="h-full w-full bg-neutral-100 font-poppins dark:bg-neutral-950 dark:text-white"
  >
    <script type="module" src="/src/main.ts"></script>
    <script>
      if ("serviceWorker" in navigator && !location.pathname.includes("Visualizer")) {
        navigator.serviceWorker.register("sw.js").then(
          (registration) => {
            console.log(
              "Service worker registration successful:",
              registration,
            );
          },
          (error) => {
            console.error(`Service worker registration failed: ${error}`);
          },
        );
      }
    </script>
  </body>
</html>
